schema_version: 1

project:
  id: smj-ks-pos
  display_name: SMJ KS POS
  system_name: KsタブレットPOS（次世代システム）
  document_name: KsタブレットPOS プロジェクト管理サマリー
  target: 共通部品開発（初期開発）／デバイス制御層
  milestone: 【MS】共通部品開発（初期開発）
  version: "1.0"
  created_date: "2026-08-04"
  author: VTI サム
  reviewer: SMJ 小林、SMJ鎌田、SMJ 南
  approver: SMJ 菅原
  purpose: デバイス制御層に関する設計、プログラム仕様書、ソースコード修正、テストおよびレビューの進捗と判断事項を一元管理する。
  expected_outcome: 2026年8月のプログラム仕様書納品と9月の設計・開発完了に向け、成果物、レビュー、課題およびリスクを追跡できる状態。
  document_category: プロジェクト管理（WBS・レビュー・リスク）
  confidentiality: 関係者限り
  folder: smj-ks-pos
  aliases: []

knowledge_memory:
  backend: falkordblite
  graph: pm_control_smj_ks_pos_knowledge_memory_v1
  database_path: scratch/falkordblite/smj-ks-pos.db

source_code:
  projects:
    - id: tabletposboilerplate
      path: sources/tabletposboilerplate
      codegraph:
        enabled: true
      scip:
        enabled: true
        indexer: scip-dotnet
        indexer_version: "0.2.14"
        consumer_version: "0.9.0"
        output_dir: scratch/indexes/scip/tabletposboilerplate
        targets:
          - id: applications
            path: TabetPos.Applications/TabetPos.Applications.csproj
          - id: application-controls
            path: TabetPos.ApplicationControls/TabetPos.ApplicationControls.csproj
          - id: application-utils
            path: TabetPos.ApplicationUtils/TabetPos.ApplicationUtils.csproj
          - id: core
            path: TabetPos.Core/TabetPos.Core.csproj
          - id: device-control
            path: TabetPos.DeviceCtrl/TabetPos.DeviceCtrl.csproj
          - id: host-app-server
            path: TabetPos.Host/src/AppServer/AppServer.csproj
          - id: host-app-stop-server
            path: TabetPos.Host/src/AppStopServer/AppStopServer.csproj
          - id: host-device-definition
            path: TabetPos.Host/src/TabletDeviceDefinition/TabletDeviceDefinition.csproj
          - id: host-device-manager
            path: TabetPos.Host/src/TabletDeviceManager/TabletDeviceManager.csproj
          - id: host-device-setting
            path: TabetPos.Host/src/TabletDeviceSettingBase/TabletDeviceSettingBase.csproj
          - id: host-device-base
            path: TabetPos.Host/src/TabletDevice/DeviceBase/DeviceBase.csproj
          - id: host-cash-changer-base
            path: TabetPos.Host/src/TabletDevice/CashChanger/CashChangerBase/CashChangerBase.csproj
          - id: host-cash-changer
            path: TabetPos.Host/src/TabletDevice/CashChanger/CashChangerByRT300/CashChangerByRT300.csproj
          - id: host-cash-drawer
            path: TabetPos.Host/src/TabletDevice/CashDrawer/CashDrawerBySharp/CashDrawerBySharp.csproj
          - id: host-customer-display
            path: TabetPos.Host/src/TabletDevice/CustomerDisplay/CustomerDisplayBySharp/CustomerDisplayBySharp.csproj
          - id: host-tablet
            path: TabetPos.Host/src/TabletHost/DeviceHost/TabletHost.csproj
          - id: host-test-device-core
            path: TabetPos.Host/tests/DeviceHostCore.Tests/DeviceHostCore.Tests.csproj
          - id: host-test-device-setting
            path: TabetPos.Host/tests/TabletDeviceSettingBase.Tests/TabletDeviceSettingBase.Tests.csproj
          - id: ui-tests
            path: TabetPos.UITests/TabetPos.UITests.csproj

